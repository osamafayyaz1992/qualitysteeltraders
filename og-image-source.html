<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source used to render og-image.png (1200x630). Not a public page.
     Regenerate: msedge --headless=new --screenshot=og-image.png --window-size=1200,630 og-image-source.html -->
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0d1117;color:#e8edf2;
       font-family:'Inter',sans-serif;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(192,169,107,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(192,169,107,.05) 1px,transparent 1px);
    background-size:60px 60px}
  .sheen{position:absolute;top:-25%;right:-10%;width:70%;height:150%;
    background:radial-gradient(ellipse at top right,rgba(30,58,95,.65) 0%,rgba(13,17,23,0) 70%)}
  .wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{display:flex;align-items:center;gap:14px;font-family:'Barlow Condensed',sans-serif;
    font-size:22px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#c0a96b;margin-bottom:24px}
  .eyebrow::before{content:'';width:46px;height:3px;background:#c0a96b}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:112px;font-weight:800;line-height:.92;
     text-transform:uppercase;letter-spacing:-.005em}
  h1 em{font-style:normal;color:#c0a96b;display:block}
  p{font-size:24px;color:#8a9aab;margin-top:28px;max-width:960px;line-height:1.5;white-space:nowrap}
  .bar{position:absolute;left:0;right:0;bottom:0;background:#c0a96b;padding:16px 80px;
    display:flex;gap:44px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#0d1117}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="sheen"></div>
  <div class="wrap">
    <div class="eyebrow">Lahore, Pakistan</div>
    <h1>Quality<em>Steel Traders</em></h1>
    <p>Sheets &amp; coils — grade 201, 304 &amp; 430, every gauge from 18 to 30</p>
  </div>
  <div class="bar">
    <span>50 Steel Market, Garhi Shahu</span>
    <span>◆</span>
    <span>+92 332 4495351</span>
    <span>◆</span>
    <span>4x8 · 4x10</span>
    <span>◆</span>
    <span>Cut to Size</span>
  </div>
</body>
</html>
